name: ci

on:
  push:
    branches:
      - '**'

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🔽
        uses: actions/checkout@v4

      - name: Build resume 📜
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: xelatex
          extra_fonts: "./fonts/*.ttf"

      - name: Build cover letter 📜
        uses: xu-cheng/latex-action@v3
        with:
          root_file: coverletter.tex
          compiler: xelatex
          extra_fonts: "./fonts/*.ttf"

      - name: Upload Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: Resume.pdf
          path: resume.pdf

      - name: Upload Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: CoverLetter.pdf
          path: coverletter.pdf

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/website'
    environment:
      name: tkuipers.ca
      url: https://resume.tkuipers.ca
    steps:
      - name: Get build artifact
        uses: actions/download-artifact@v4
        with:
          name: Resume.pdf
      - uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_DEPLOY_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_KEY_SECRET }}
          AWS_REGION: 'us-east-1'
      - name: Invalidate CloudFront Cache https://resume.tkuipers.ca
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION }}
          PATHS: "/*"
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_KEY_SECRET }}

